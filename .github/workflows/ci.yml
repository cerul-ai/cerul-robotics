name: Robotics CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: robotics-${{ github.ref }}
  cancel-in-progress: true
jobs:
  robotics:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install native prerequisites (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg protobuf-compiler libprotobuf-dev
      - name: Install native prerequisites (macOS)
        if: runner.os == 'macOS'
        run: |
          brew list ffmpeg || brew install ffmpeg
          brew list protobuf || brew install protobuf
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - run: cargo run --locked --example generate_schemas -- --check
