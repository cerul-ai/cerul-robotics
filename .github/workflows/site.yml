name: Website
on:
  push:
    branches: [main]
    paths: ["site/**", "wrangler.jsonc", ".github/workflows/site.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: website
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://robotics.cerul.ai
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - name: Skip until Cloudflare credentials are configured
        if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == ''
        run: echo "::notice::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not set; site not deployed."
      - name: Deploy site/ to Cloudflare
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: npx --yes wrangler@4.136.0 deploy
